name: API CI

on:
  push:
    paths: ["apps/api/**", ".github/workflows/api-ci.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api-ci.yml"]

jobs:
  php-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer deps
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare .env for CI
        run: |
          cp .env.example .env || true
          echo "APP_ENV=testing" >> .env
          echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env
          echo "CACHE_DRIVER=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          mkdir -p database
          touch database/database.sqlite

      - name: App key (idempotent)
        run: php artisan key:generate || true

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test --testsuite=Feature --colors=always
