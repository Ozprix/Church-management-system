name: API Container Build

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-container.yml"
  push:
    branches: [dev]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-container.yml"

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/docker/Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/church-api:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.14.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/church-api:${{ github.sha }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: docker push ghcr.io/${{ github.repository_owner }}/church-api:${{ github.sha }}
